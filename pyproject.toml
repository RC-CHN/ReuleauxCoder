[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reuleauxcoder"
version = "0.11.2"
description = "Reinventing the wheel, but only for those who prefer it non-circular."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "RC-CHN", email = "sorainygreen@gmail.com" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "terminal", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.28",
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "pywinpty>=3.0.4; sys_platform == 'win32'",
    "pyyaml>=6.0",
    "socksio>=1.0.0",
    "tiktoken>=0.12.0",
    "regex>=2024.11.6",
    "Pillow>=10.4",
]

[tool.hatch.build.targets.wheel]
packages = ["reuleauxcoder"]

[tool.hatch.build]
artifacts = ["reuleauxcoder/_tui/**"]

[tool.hatch.build.targets.sdist]
exclude = ["**/node_modules/**", "/reuleauxcoder-agent/reuleauxcoder-agent", "/reuleauxcoder-agent/*.exe"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
skill-tests = [
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.0",
    "PyMuPDF>=1.26",
    "reportlab>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rcoder = "reuleauxcoder.interfaces.launcher:main"
rcoder-cli = "reuleauxcoder.interfaces.cli.main:main"
rcoder-tui = "reuleauxcoder.interfaces.launcher:tui_main"

[project.urls]
Homepage = "https://github.com/RC-CHN/ReuleauxCoder"
Repository = "https://github.com/RC-CHN/ReuleauxCoder"
Issues = "https://github.com/RC-CHN/ReuleauxCoder/issues"
