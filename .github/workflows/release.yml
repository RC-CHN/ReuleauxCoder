name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  peer-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: rcoder-peer-linux-amd64
          - goos: linux
            goarch: arm64
            filename: rcoder-peer-linux-arm64
          - goos: darwin
            goarch: amd64
            filename: rcoder-peer-darwin-amd64
          - goos: darwin
            goarch: arm64
            filename: rcoder-peer-darwin-arm64
          - goos: windows
            goarch: amd64
            filename: rcoder-peer-windows-amd64.exe
          - goos: windows
            goarch: arm64
            filename: rcoder-peer-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: reuleauxcoder-agent/go.mod
          cache: false

      - name: Run Go release tests and dependency gate
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: reuleauxcoder-agent
        run: |
          test "$(go list -m all | wc -l)" -eq 1
          go test ./...

      - name: Cross-build peer
        working-directory: reuleauxcoder-agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o ../${{ matrix.filename }} ./cmd/reuleauxcoder-agent

      - name: Enforce 20 MiB peer size budget
        run: test "$(wc -c < '${{ matrix.filename }}')" -le 20971520

      - name: Upload peer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          if-no-files-found: error

  release:
    needs: peer-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

      - name: Download peer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rcoder-peer-*
          path: dist/peer
          merge-multiple: true

      - name: Generate peer SHA-256 manifest
        working-directory: dist/peer
        run: sha256sum rcoder-peer-* > SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/reuleauxcoder-host
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/peer/*
