name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  peer-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: rcoder-peer-linux-amd64
          - goos: linux
            goarch: arm64
            filename: rcoder-peer-linux-arm64
          - goos: darwin
            goarch: amd64
            filename: rcoder-peer-darwin-amd64
          - goos: darwin
            goarch: arm64
            filename: rcoder-peer-darwin-arm64
          - goos: windows
            goarch: amd64
            filename: rcoder-peer-windows-amd64.exe
          - goos: windows
            goarch: arm64
            filename: rcoder-peer-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: reuleauxcoder-agent/go.mod
          cache: false

      - name: Run Go release tests and dependency gate
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: reuleauxcoder-agent
        run: |
          test "$(go list -m all | wc -l)" -eq 1
          go test ./...

      - name: Cross-build peer
        working-directory: reuleauxcoder-agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o ../${{ matrix.filename }} ./cmd/reuleauxcoder-agent

      - name: Enforce 20 MiB peer size budget
        run: test "$(wc -c < '${{ matrix.filename }}')" -le 20971520

      - name: Upload peer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          if-no-files-found: error

  release:
    needs: peer-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Setup Node for bundled distribution
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            reuleauxcoder-tui/package-lock.json
            reuleauxcoder-vscode/package-lock.json

      - name: Bundle TUI
        run: |
          npm ci --prefix reuleauxcoder-tui
          npm run bundle --prefix reuleauxcoder-tui

      - name: Build distributions
        run: uv build

      - name: Check packaged frontends
        run: uv run python scripts/check-distributions.py

      - name: Install wheel and smoke test outside checkout
        run: uv run python scripts/smoke-install.py

      - name: Package VS Code extension with compatible core
        run: |
          npm ci --prefix reuleauxcoder-vscode
          npm run package --prefix reuleauxcoder-vscode
          npm run test:install --prefix reuleauxcoder-vscode

      - name: Validate release versions and prepare changelog notes
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import tomllib

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = tomllib.loads(Path("pyproject.toml").read_text())
          lock = tomllib.loads(Path("uv.lock").read_text())
          extension = json.loads(Path("reuleauxcoder-vscode/package.json").read_text())
          assert project["project"]["version"] == version
          assert next(p["version"] for p in lock["package"] if p["name"] == "reuleauxcoder") == version
          assert extension["version"] == version
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = next(part for part in changelog.split("\n## ") if part.startswith(version + " - "))
          notes = section.split("\n", 1)[1].strip() + "\n"
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes, encoding="utf-8")

      - name: Download peer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rcoder-peer-*
          path: dist/peer
          merge-multiple: true

      - name: Generate peer SHA-256 manifest
        working-directory: dist/peer
        run: sha256sum rcoder-peer-* > SHA256SUMS

      - name: Stage release peers for Docker
        shell: python
        run: |
          from pathlib import Path
          import shutil

          for platform in ("linux", "darwin", "windows"):
              suffix = ".exe" if platform == "windows" else ""
              for arch in ("amd64", "arm64"):
                  source = Path("dist/peer") / f"rcoder-peer-{platform}-{arch}{suffix}"
                  target = Path("artifacts/remote") / platform / arch / f"rcoder-peer{suffix}"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
                  target.chmod(0o755)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/reuleauxcoder-host
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/peer/*
            reuleauxcoder-vscode/*.vsix
