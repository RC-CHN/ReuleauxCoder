name: CI

on:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

  peer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: reuleauxcoder-agent/go.mod
          cache: false

      - name: Enforce stdlib-only dependency budget
        working-directory: reuleauxcoder-agent
        run: test "$(go list -m all | wc -l)" -eq 1

      - name: Run Go tests and protocol fixture drift checks
        working-directory: reuleauxcoder-agent
        run: go test ./...

  lsp-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Provision real LSP servers
        run: |
          npm install -g pyright
          npm install --prefix .lsp-legacy @typescript/typescript6@6 typescript-language-server@5
          rustup component add rust-analyzer

      - name: Run Python, native TS7, legacy TS6, JS and Rust matrix
        env:
          RCODER_RUN_LSP_INTEGRATION: "1"
        run: PATH="${{ github.workspace }}/.lsp-legacy/node_modules/.bin:$PATH" uv run pytest tests/extensions/lsp/test_integration_smoke.py -k "python or typescript or javascript or rust" -q -rs

  peer-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: rcoder-peer-linux-amd64
          - goos: linux
            goarch: arm64
            filename: rcoder-peer-linux-arm64
          - goos: darwin
            goarch: amd64
            filename: rcoder-peer-darwin-amd64
          - goos: darwin
            goarch: arm64
            filename: rcoder-peer-darwin-arm64
          - goos: windows
            goarch: amd64
            filename: rcoder-peer-windows-amd64.exe
          - goos: windows
            goarch: arm64
            filename: rcoder-peer-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: reuleauxcoder-agent/go.mod
          cache: false

      - name: Cross-build peer
        working-directory: reuleauxcoder-agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o ../${{ matrix.filename }} ./cmd/reuleauxcoder-agent

      - name: Enforce 20 MiB peer size budget
        run: test "$(wc -c < '${{ matrix.filename }}')" -le 20971520

      - name: Inspect Go build metadata
        run: go version -m "${{ matrix.filename }}"

      - name: Upload peer smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          if-no-files-found: error
