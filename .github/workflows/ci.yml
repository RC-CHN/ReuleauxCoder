name: CI

on:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync dependencies
        run: uv sync --locked --extra dev --group skill-tests

      - name: Run tests
        run: uv run --group skill-tests pytest -q

      - name: Setup Node for bundled distribution
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reuleauxcoder-tui/package-lock.json

      - name: Bundle TUI
        run: |
          npm ci --prefix reuleauxcoder-tui
          npm run bundle --prefix reuleauxcoder-tui

      - name: Build distributions
        run: uv build

      - name: Check packaged frontends
        run: uv run python scripts/check-distributions.py

      - name: Install wheel and smoke test outside checkout
        run: uv run python scripts/smoke-install.py

  tui-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: reuleauxcoder-tui/package-lock.json
      - name: Sync Python dependencies
        run: uv sync --locked --extra dev
      - name: Install TUI dependencies
        run: npm ci --prefix reuleauxcoder-tui
      - name: Build and test TUI with real Python runtime (PTY on Linux)
        run: npm test --prefix reuleauxcoder-tui

  vscode-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: reuleauxcoder-vscode/package-lock.json
      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev
      - name: Install extension dependencies
        run: npm ci --prefix reuleauxcoder-vscode
      - name: Test extension with real core
        run: npm test --prefix reuleauxcoder-vscode
      - name: Test native VS Code editor integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension --prefix reuleauxcoder-vscode
      - name: Test native VS Code editor integration on Windows
        if: runner.os == 'Windows'
        run: npm run test:extension --prefix reuleauxcoder-vscode
      - name: Install browser and Linux dependencies
        if: runner.os == 'Linux'
        working-directory: reuleauxcoder-vscode
        run: npx playwright install --with-deps chromium
      - name: Install Windows browser
        if: runner.os == 'Windows'
        working-directory: reuleauxcoder-vscode
        run: npx playwright install chromium
      - name: Test bilingual webview and attachments
        timeout-minutes: 5
        run: npm run test:webview --prefix reuleauxcoder-vscode
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reuleauxcoder-vscode-previews-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            artifacts/vscode-concept/*.png
            artifacts/vscode-concept/*.html
          if-no-files-found: warn
      - name: Package compatible core and VSIX
        run: npm run package --prefix reuleauxcoder-vscode
      - name: Install packaged core outside checkout and check protocol
        run: npm run test:install --prefix reuleauxcoder-vscode
      - name: Upload extension smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: reuleauxcoder-vscode-${{ matrix.os }}-node${{ matrix.node }}
          path: reuleauxcoder-vscode/*.vsix
          if-no-files-found: error

  peer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: reuleauxcoder-agent/go.mod
          cache: false

      - name: Enforce stdlib-only dependency budget
        working-directory: reuleauxcoder-agent
        run: test "$(go list -m all | wc -l)" -eq 1

      - name: Run Go tests and protocol fixture drift checks
        working-directory: reuleauxcoder-agent
        run: go test ./...

  lsp-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Sync Python dependencies
        run: uv sync --locked --extra dev

      - name: Provision real LSP servers
        run: |
          npm install -g pyright
          npm install --prefix .lsp-legacy @typescript/typescript6@6 typescript-language-server@5
          rustup component add rust-analyzer

      - name: Run Python, native TS7, legacy TS6, JS and Rust matrix
        env:
          RCODER_RUN_LSP_INTEGRATION: "1"
        run: PATH="${{ github.workspace }}/.lsp-legacy/node_modules/.bin:$PATH" uv run pytest tests/extensions/lsp/test_integration_smoke.py -k "python or typescript or javascript or rust" -q -rs

  peer-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: rcoder-peer-linux-amd64
          - goos: linux
            goarch: arm64
            filename: rcoder-peer-linux-arm64
          - goos: darwin
            goarch: amd64
            filename: rcoder-peer-darwin-amd64
          - goos: darwin
            goarch: arm64
            filename: rcoder-peer-darwin-arm64
          - goos: windows
            goarch: amd64
            filename: rcoder-peer-windows-amd64.exe
          - goos: windows
            goarch: arm64
            filename: rcoder-peer-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: reuleauxcoder-agent/go.mod
          cache: false

      - name: Cross-build peer
        working-directory: reuleauxcoder-agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o ../${{ matrix.filename }} ./cmd/reuleauxcoder-agent

      - name: Enforce 20 MiB peer size budget
        run: test "$(wc -c < '${{ matrix.filename }}')" -le 20971520

      - name: Inspect Go build metadata
        run: go version -m "${{ matrix.filename }}"

      - name: Upload peer smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          if-no-files-found: error
